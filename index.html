<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>CHV — Ingreso interno</title>
  <link rel="stylesheet" href="styles.css?v=37" />
  <link rel="stylesheet" href="logo.css?v=37" />
</head>
<body>
  <div id="gate" class="gate">
    <form id="login" class="login" autocomplete="off">
      <div class="login-logo" role="img" aria-label="CHV / Decisiones inmobiliarias"></div>
      <h1>Ingreso interno</h1>
      <p>Usuario y clave de oficina</p>
      <label>Usuario
        <input id="user" name="username" type="text" required value="" placeholder="" autocomplete="off" />
      </label>
      <label>Clave
        <input id="pass" name="password" type="password" required value="" placeholder="" autocomplete="off" />
      </label>
      <button type="submit">Entrar</button>
      <p id="err" class="err" hidden>Usuario o clave incorrectos.</p>
    </form>
  </div>
  <div id="app" hidden>
    <header class="top">
      <div class="brand">
        <span class="logo-txt">CHV / Decisiones inmobiliarias</span>
        <div class="titles-wrap">
          <button type="button" class="titles" id="boardBtn">
            <span class="titles-txt">
              <span class="t-name" id="boardName">Tablero: CABEZA</span>
              <span class="origen" id="origen">Asuntos y tareas — Escritorio y celular</span>
            </span>
            <span class="chev">▾</span>
          </button>
          <div class="board-menu" id="boardMenu" hidden></div>
        </div>
        <div class="board-btns">
          <button type="button" id="btnEditBoard" class="hdr-btn icon-btn" title="Editar tablero" aria-label="Editar tablero">✎</button>
          <button type="button" id="btnNewBoard" class="hdr-btn" title="Crear tablero vacío">+ Tablero</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </header>
    <section class="filters">
      <input id="q" type="search" placeholder="Buscar asunto, código o tarea…" autocomplete="off" />
      <select id="casillero"><option value="">Todos los casilleros</option></select>
      <select id="estado"><option value="">Todos los estados</option></select>
    </section>
    <section class="actions">
      <button type="button" id="btnCas">+ Casilleros</button>
      <button type="button" id="btnAsunto">+ Asunto</button>
      <button type="button" id="btnTarea">+ Tarea</button>
      <button type="button" id="btnSync" class="ghost">Sincronizar Sheets</button>
      <button type="button" id="btnExp" class="ghost">Exportar</button>
    </section>
    <main id="list" class="list"></main>
    <p class="foot"><button type="button" id="salir">Cerrar sesión</button></p>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="sheet" id="sheet"></div>
  </div>
  <script>
    (function () {
      var KEY = "chv_tablero_ok";
      var PASS = "250578";
      var gate = document.getElementById("gate");
      var app = document.getElementById("app");
      var err = document.getElementById("err");
      function openApp() { gate.hidden = true; app.hidden = false; }
      if (sessionStorage.getItem(KEY) === "1") openApp();
      document.getElementById("login").addEventListener("submit", function (e) {
        e.preventDefault();
        var u = (document.getElementById("user").value || "").trim().toLowerCase();
        var p = String(document.getElementById("pass").value || "").trim();
        var ok = (u === "chv" || u === "mlv") && p === PASS;
        if (ok) { err.hidden = true; sessionStorage.setItem(KEY, "1"); sessionStorage.setItem("chv_user", u.toUpperCase()); openApp(); }
        else err.hidden = false;
      });
      document.getElementById("salir").addEventListener("click", function () {
        sessionStorage.removeItem(KEY); sessionStorage.removeItem("chv_user"); location.reload();
      });
    })();
  </script>
  <script src="config.js?v=37"></script>
  <script src="app.js?v=37"></script>
</body>
</html>
