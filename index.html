<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>CHV — Tablero: CABEZA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="gate" class="gate">
    <form id="login" class="login" autocomplete="on">
      <div class="chv-mini">CHV / Decisiones inmobiliarias</div>
      <h1>Tablero: CABEZA</h1>
      <p>Ingreso interno</p>
      <label>Usuario
        <input id="user" name="username" type="text" required autocomplete="username" />
      </label>
      <label>Clave
        <input id="pass" name="password" type="password" required autocomplete="current-password" />
      </label>
      <button type="submit">Entrar</button>
      <p id="err" class="err" hidden>Usuario o clave incorrectos</p>
    </form>
  </div>

  <div id="app" hidden>
    <div class="chv-banner">
      <div class="chv-banner-l"><span class="chv-word">CHV</span><span class="slash">/</span><span>Decisiones<br>inmobiliarias</span></div>
      <div class="chv-banner-r">25 de Mayo 78, Avellaneda<br>www.chv.ar · contacto@chv.ar<br>11 6719 9866 · 11 4201 3150</div>
    </div>
    <header class="top">
      <div class="brand">
        <div>
          <h1>Tablero: CABEZA</h1>
          <p class="sub" id="origen">Asuntos y tareas · escritorio y celular</p>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </header>
    <section class="filters">
      <input id="q" type="search" placeholder="Buscar asunto, código o tarea…" autocomplete="off" />
      <select id="casillero"><option value="">Todos los casilleros</option></select>
      <select id="estado"><option value="">Todos los estados</option></select>
    </section>
    <section class="actions">
      <button type="button" id="btnAsunto">+ Asunto</button>
      <button type="button" id="btnTarea">+ Tarea</button>
      <button type="button" id="btnCas">Casilleros</button>
      <button type="button" id="btnSync" class="ghost">Sincronizar Sheets</button>
      <button type="button" id="btnExp" class="ghost">Exportar</button>
    </section>
    <main id="list" class="list"></main>
    <p class="foot"><button type="button" id="salir">Cerrar sesión</button></p>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="sheet" id="sheet"></div>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
